# Registers nexus as a ServiceAccountProducer
apiVersion: k8s.cloudogu.com/v2
kind: ServiceAccountProducer
metadata:
  name: {{ include "nexus.name" . }}
  labels:
    {{- include "nexus.labels" . | nindent 4 }}
spec:
  producer: {{ include "nexus.name" . }}
  http:
    endpoint: "http://{{ include "nexus.name" . }}.{{ .Release.Namespace }}.svc:{{ (index .Values.nexus.service.ports "sa-manager").port }}/serviceaccounts"
    authSecret:
      name: {{ include "nexus.fullname" . }}-sa-manager-auth
      key: apiKey
    priority: 1
    # params/return live under spec.http (verified against the ServiceAccountProducer CRD's
    # OpenAPI schema in-cluster) - the ADR-0055 draft sketches them as spec-level siblings of
    # http, which the actual CRD does not accept.
    params:
      attributes:
        fullAccessRepository:
          description: "Name of a hosted raw repository to create and grant full read/write access to (optional)."
          type: string
        permissions:
          description: "Comma-separated list of additional Nexus privileges to grant to the service account (optional)."
          type: string
    return:
      username:
        description: "Generated technical username for the service account."
      password:
        description: "Password for the generated service account."
