# PostgreSQL credentials for the self-contained database.
#
# Serves two consumers from a single, consistent set of credentials:
#   1. The postgresql StatefulSet (POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB).
#   2. The nexus container's doguctl: util.sh reads `doguctl config -e sa-postgresql/{username,password,database}`,
#      which resolves against the sensitive config mounted at /etc/ces/config/sensitive/config.yaml.
#
# The password is generated once and kept stable across `helm upgrade` via lookup.
{{ $secretName := printf "%s-postgresql" (include "nexus.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $password := "" -}}
{{- if and $existing $existing.data (index $existing.data "password") -}}
{{- $password = index $existing.data "password" | b64dec -}}
{{- else -}}
{{- $password = randAlphaNum 32 -}}
{{- end -}}
{{- $user := .Values.postgresql.auth.username -}}
{{- $db := .Values.postgresql.auth.database -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "nexus.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Raw keys consumed by the postgresql container.
  username: {{ $user | quote }}
  password: {{ $password | quote }}
  database: {{ $db | quote }}
  # doguctl "sensitive" config source (mounted at /etc/ces/config/sensitive/config.yaml).
  sensitive-config.yaml: |
    sa-postgresql:
      username: {{ $user | quote }}
      password: {{ $password | quote }}
      database: {{ $db | quote }}
