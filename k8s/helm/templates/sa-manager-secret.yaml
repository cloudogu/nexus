# API key shared between the nexus-sa-manager sidecar (API_KEY env var) and the
# ServiceAccountProducer CR (spec.http.authSecret), which the service-account-operator reads to
# authenticate its requests via the X-CES-SA-API-KEY header.
#
# Generated once and kept stable across `helm upgrade` via lookup.
{{ $secretName := printf "%s-sa-manager-auth" (include "nexus.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $apiKey := "" -}}
{{- if and $existing $existing.data (index $existing.data "apiKey") -}}
{{- $apiKey = index $existing.data "apiKey" | b64dec -}}
{{- else -}}
{{- $apiKey = randAlphaNum 32 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "nexus.labels" . | nindent 4 }}
type: Opaque
stringData:
  apiKey: {{ $apiKey | quote }}
