apiVersion: v1
kind: Service
metadata:
  name: {{ include "nexus.postgresqlServiceName" . }}
  labels:
    {{- include "nexus.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  type: ClusterIP
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
      protocol: TCP
  selector:
    {{- include "nexus.postgresqlSelectorLabels" . | nindent 4 }}
